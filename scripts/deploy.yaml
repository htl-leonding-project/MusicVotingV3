apiVersion: apps/v1
kind: Deployment
metadata:
  name: music-frontend-deployment
  namespace: student-it210196
spec:
  replicas: 1
  selector:
    matchLabels:
      app: music-frontend
  template:
    metadata:
      labels:
        app: music-frontend
    spec:
      containers:
        - name: frontend
          image: ghcr.io/musicvoting/musicvotingv3-frontend
          ports:
            - containerPort: 80
          imagePullPolicy: Always
---
apiVersion: v1
kind: Service
metadata:
  name: music-frontend-svc
  namespace: student-it210196
spec:
  ports:
    - port: 80
      targetPort: 80
      protocol: TCP
      name: http
  selector:
    app: music-frontend
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: backend-ingress-mv
  namespace: student-it210196
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /$2
spec:
  rules:
    - host: it210196.cloud.htl-leonding.ac.at
      http:
        paths:
          - path: /music-voting(/|$)(.*)$
            pathType: Prefix
            backend:
              service:
                name: music-frontend-svc
                port:
                  number: 80
